<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icon-192.png">
<title>KML/KMZ View đã chuyển địa chỉ</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #202124; font: 16px Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; color: #1a73e8; }
  p { margin: 0; max-width: 420px; line-height: 1.5; color: #5f6368; }
  a.btn { display: inline-block; background: #1a73e8; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 500; }
  code { color: #202124; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>KML/KMZ View đã chuyển sang địa chỉ mới</h1>
  <p>Địa chỉ mới: <code>https://kmlview-manh.github.io</code><br>Hãy gỡ app cũ và cài lại từ địa chỉ mới (Chrome › ⋮ › Cài đặt ứng dụng).</p>
  <a class="btn" href="https://kmlview-manh.github.io/">Mở KML/KMZ View</a>
</main>
<script>
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch (e) {}
</script>
</body>
</html>
